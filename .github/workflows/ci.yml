name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Ensure CLI entry casing
        run: |
          if [ ! -f Index.js ] && [ -f index.js ]; then
            cp index.js Index.js
          fi

      - name: Run smoke tests
        run: npm test
